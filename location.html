<html lang="ko">
<head>

  <style>
    :root { --ink:#5f7359; --ink-dark:#52654d; --line:#dfe6db; --bg:#fbfcf8; --card:#fff; }
    *{box-sizing:border-box;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink-dark);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;display:flex;justify-content:center;padding:28px 18px calc(28px + env(safe-area-inset-bottom));}
    .wrap{width:min(100%,430px);}
    .card{background:var(--card);border:1px solid #e2e8de;border-radius:22px;padding:30px 22px 24px;box-shadow:0 8px 30px rgba(92,112,83,.08);}
    .head{text-align:center;}
    .wedding-date{margin:0 0 22px;font-size:16px;line-height:1.5;font-weight:700;color:#71816b;}
    .eyebrow{margin:0 0 8px;font-size:11px;letter-spacing:2px;color:#8a9a84;}
    h1{margin:0;font-size:16px;line-height:1.5;font-weight:700;color:#71816b;}
    .venue-floor{margin:8px 0 0;font-size:16px;line-height:1.5;font-weight:700;color:#71816b;}
    .address{margin:2px 0 12px;font-size:13px;line-height:1.55;color:#71816b;}
    .venue-map{display:block;width:100%;height:auto;margin:0 0 24px;border-radius:12px;}
.section-title{text-align:center;margin:24px 0 10px;font-size:13px;font-weight:700;color:#6b7c65;}
    .map-buttons{display:flex;flex-direction:column;gap:9px;}
    .map-btn,.back{display:flex;align-items:center;justify-content:center;min-height:48px;padding:11px 14px;border-radius:999px;border:1px solid #71866a;background:#71866a;color:#fff;text-decoration:none;font-size:13px;font-weight:600;-webkit-tap-highlight-color:transparent;}
    .map-btn:active,.back:active{transform:translateY(1px);}
    .info{margin-top:22px;border-top:1px solid var(--line);padding-top:4px;text-align:left;}
    .info-row{padding:14px 2px;border-bottom:1px solid #edf1ea;}
    .info-row:last-child{border-bottom:0;}
    .info-label{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:#657761;}
    .info-text{margin:0;white-space:pre-line;font-size:12px;line-height:1.7;color:#778574;}
    .back{margin-top:18px;background:#fff;color:#71816b;border-color:#b7c5ae;}
    @media (max-width:340px){body{padding-left:14px;padding-right:14px}.card{padding-left:18px;padding-right:18px;}}
  </style>

      <div class="info" aria-label="웨딩홀 교통 및 주차 정보">
        <div class="info-row">
          <span class="info-label">🚇 지하철</span>
          <p class="info-text" id="subway"></p>
        </div>
        <div class="info-row">
          <span class="info-label">🚌 버스</span>
          <p class="info-text" id="bus"></p>
        </div>
        <div class="info-row">
          <span class="info-label">🚗 주차</span>
          <p class="info-text" id="parking"></p>
        </div>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script>
    (function () {
      const info = window.WEDDING_INFO || (typeof WEDDING_INFO !== "undefined" ? WEDDING_INFO : null);
      if (!info) return;

      document.title = `오시는 길 - ${info.weddingHall}`;
      document.getElementById("pageTitle").textContent = info.weddingHall || "";
      document.getElementById("subway").textContent = info.subway || "";
      document.getElementById("bus").textContent = info.bus || "";
      document.getElementById("parking").textContent = info.parking || "";

      document.getElementById("btnKakao").href = info.kakaoMapUrl || "#";
      document.getElementById("btnNaver").href = info.naverMapUrl || "#";

      function buildTmapUrl() {
        if (info.tmapUrl && info.tmapUrl.trim()) return info.tmapUrl.trim();
        const name = encodeURIComponent(info.weddingHall || "예식장");
        if (info.latitude && info.longitude) {
          return `tmap://route?goalname=${name}&goalx=${info.longitude}&goaly=${info.latitude}`;
        }
        return `tmap://route?rGoName=${name}`;
      }

      function getTmapStoreUrl() {
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        return isIOS ? "https://apps.apple.com/kr/app/id431589174" : "https://play.google.com/store/apps/details?id=com.skt.tmap.ku";
      }

      const tmapBtn = document.getElementById("btnTmap");
      tmapBtn.href = buildTmapUrl();
      tmapBtn.addEventListener("click", function () {
        const clickedAt = Date.now();
        setTimeout(function () {
          if (!document.hidden && Date.now() - clickedAt < 2000) window.location.href = getTmapStoreUrl();
        }, 1200);
      });
    })();
  </script>
</body>
</html>
